<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mi Portfolio</title>
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css">
</head>
<body>
  <div id="app"></div>
  <script>
     window.$docsify = {
        name: 'Mi Portfolio',
        repo: 'Alex105194/UT7',
        loadSidebar: true,
        subMaxLevel: 3,
        themeColor: '#42b983'
    };
  </script>
  <!-- Docsify resource -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>

  <button id="pdf-button" onclick="descargarPDF()">
    📄 Descargar esta página en PDF
  </button>
  <!-- Librería para generar PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    async function descargarPDF() {

      const contenido = document.querySelector('.markdown-section');
      const boton = document.getElementById('pdf-button');

      if (!contenido) {
        alert('No se ha encontrado el contenido de esta página.');
        return;
      }

      if (typeof html2pdf === 'undefined') {
        alert('No se ha podido cargar la librería PDF. Comprueba tu conexión.');
        return;
      }

      const nombrePagina = location.hash
        .replace(/^#\/?/, '')
        .replace(/\//g, '-')
        .replace(/[^\w\-áéíóúÁÉÍÓÚñÑ]/g, '') || 'inicio';

      const opciones = {
        margin: 10,
        filename: nombrePagina + '.pdf',

        image: {
          type: 'jpeg',
          quality: 0.98
        },

        html2canvas: {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff',
          scrollY: 0
        },

        jsPDF: {
          unit: 'mm',
          format: 'a4',
          orientation: 'portrait'
        },

        pagebreak: {
          mode: ['css', 'legacy']
        }
      };

      try {
        boton.disabled = true;
        boton.textContent = '⏳ Generando PDF...';

        await html2pdf()
          .set(opciones)
          .from(contenido)
          .save();

      } catch (error) {
        console.error(error);
        alert('Ha ocurrido un error al generar el PDF.');
      } finally {
        boton.disabled = false;
        boton.textContent = '📄 Descargar esta página en PDF';
      }
    }
  </script>

</body>
</html>
